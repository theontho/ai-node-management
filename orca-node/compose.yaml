name: orca-node

services:
  orca:
    image: local/orca-node:1.4.192
    hostname: "${ORCA_CONTAINER_HOSTNAME}"
    platform: linux/amd64
    build:
      context: .
      args:
        ORCA_VERSION: 1.4.192
        ORCA_APPIMAGE_SHA256: 9003e78c6c0287c5173569bc91529da4a9963b2d4245fd23701651799abca77c
        UBUNTU_SNAPSHOT: 20260829T000000Z
        NODE_VERSION: 22.23.2
        NODE_LINUX_X64_SHA256: d60acfe00a2932254bb0ad20e01b0d74397a0875595de719654b214f4b03f307
        COPILOT_CLI_VERSION: 1.0.82
        GH_VERSION: 2.98.0
        GH_LINUX_AMD64_SHA256: 3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de
    ports:
      - "${ORCA_BIND_ADDRESS}:6768:6768"
    environment:
      ORCA_KEYRING_PASSWORD_FILE: /run/secrets/orca-keyring-password
      ORCA_PAIRING_ADDRESS: ${ORCA_PAIRING_ADDRESS}
      ORCA_PAIRING_ENABLED: ${ORCA_PAIRING_ENABLED}
      ORCA_MOBILE_PAIRING: ${ORCA_MOBILE_PAIRING:-false}
      ORCA_PORT: "6768"
      ORCA_PROJECT_ROOT: /workspaces
    volumes:
      - ${DATA_ROOT}/orca-home:/home/orca
      - ${WORKSPACE_ROOT}:/workspaces
    secrets:
      - orca-keyring-password
    shm_size: 512m
    mem_limit: 3g
    cpus: 2
    pids_limit: 2048
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - /home/orca/.local/bin/orca-ide status --json | jq -e '.result.runtime.state == "ready" and .result.runtime.reachable == true' >/dev/null
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

secrets:
  orca-keyring-password:
    file: ${ORCA_KEYRING_PASSWORD_FILE}
